name: idea_robust

services:
  db:
    image: postgres:16-alpine
    container_name: idea_robust_db
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      POSTGRES_DB: ${DB_NAME:-postgres}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-idea_robust_password_123}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\"" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: idea_robust_dashboard
    restart: unless-stopped
    ports:
      - "8501:8501"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      - DB_HOST=db
    #TO AUTOMATIC RESTART WHEN SAVING CHANGES
    #COMMENT THIS IN PRODUCTION
    volumes:
      - ..:/app

  cli:
    build:
      context: ..
      dockerfile: docker/Dockerfile.cli
    container_name: idea_robust_cli
    stdin_open: true
    tty: true
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      - DB_HOST=db
    volumes:
      - ..:/app
    entrypoint: [ "python", "cli_program/setlistcli.py" ]

volumes:
  postgres_data:
